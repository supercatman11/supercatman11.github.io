# =============================================================================
# CI: PR と main への push で実行。
#   - 依存の脆弱性監査(npm audit)
#   - 型チェック + 静的ビルド
#   - 本番用 Docker イメージをビルドし、Trivy で OS パッケージ / ライブラリの脆弱性をスキャン
#
# セキュリティ方針
#   - すべての Action をコミット SHA で固定(タグ改ざん対策)。Dependabot が更新する。
#   - GITHUB_TOKEN は読み取り専用。
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint / Check / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install (lockfile strict, no scripts)
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  image:
    name: Docker image + Trivy scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          build-args: |
            APP_ENV=production
          load: true
          push: false
          tags: kuun0suke-portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kuun0suke-portfolio:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke test (headers / status)
        run: |
          set -eux
          docker run -d --rm --name smoke -p 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            kuun0suke-portfolio:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -sSI http://127.0.0.1:8080/ | tee headers.txt
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/)" = "405"
          docker stop smoke
