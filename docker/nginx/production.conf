# ------------------------------------------------------------ production -----
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # バージョン情報を隠す
    server_tokens off;

    # 不要なメソッドを拒否(静的サイトは GET / HEAD のみ)
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # 隠しファイル(.git 等)へのアクセスを拒否
    location ~ /\. { return 404; }

    include /etc/nginx/includes/security-headers.conf;

    # 圧縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # Astro がハッシュ付きファイル名で出力するアセットは長期キャッシュ
    location /_astro/ {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
