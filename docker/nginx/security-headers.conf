# 共通セキュリティヘッダー。server / location の両方で include する
# (nginx は location 内で add_header を使うと親のヘッダーを継承しないため)。

# MIME スニッフィング禁止
add_header X-Content-Type-Options "nosniff" always;
# クリックジャッキング対策(CSP frame-ancestors と二重化)
add_header X-Frame-Options "DENY" always;
# リファラ漏えいを抑制
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 不要なブラウザ機能を明示的に無効化
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# 分離ポリシー
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# CSP: このサイトは JS を一切配信しないため script-src は 'none'。
#       外部フォント・外部 CDN も使わないので全て 'self' に閉じる。
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
# HSTS は TLS を終端するリバースプロキシ / CDN 側で付与する(http のローカル検証を壊さないため、ここでは付けない)
